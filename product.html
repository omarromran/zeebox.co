<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3a200d">
  <meta name="description" content="Customize your Zee Box Brownie Box.">
  <title>Brownie Box | Zee Box</title>
  <link rel="icon" href="assets/brand/logo.jpg">
  <link rel="prefetch" href="checkout.html" as="document">
  <link rel="stylesheet" href="css/styles.css?v=announcement-fix">
</head>
<body class="product-page-body">
  <header class="site-header"><a class="brand" href="index.html"><img src="assets/brand/logo.jpg" alt="Zee Box"></a><div class="product-page-actions"><a href="index.html">Home</a><button class="cart-trigger" data-open-cart>Cart <b data-cart-count>0</b></button></div></header>
  <main class="product-page">
    <a class="back-link" href="index.html">← Back to home</a>
    <section class="product-page-layout">
      <div class="product-gallery" data-product-gallery>
        <img class="product-page-image" data-product-image alt="Brownie Box with 9 brownies">
        <button class="gallery-arrow gallery-prev" type="button" data-gallery-prev aria-label="Previous image">‹</button>
        <button class="gallery-arrow gallery-next" type="button" data-gallery-next aria-label="Next image">›</button>
        <div class="gallery-dots" data-gallery-dots></div>
      </div>
      <div class="product-page-info">
        <p class="eyebrow" data-product-pieces></p><h1 data-product-name></h1>
        <p class="product-page-description" data-product-description></p>
        <strong class="product-page-price" data-product-price></strong>
        <div class="box-count"><span>Number of boxes</span><div><button type="button" data-box-qty="-1" aria-label="Remove one box">−</button><b data-box-qty-value>1</b><button type="button" data-box-qty="1" aria-label="Add one box">+</button></div><p data-box-total>1 box · 9 brownies</p></div>
        <div data-box-fields></div>
        <button class="button button-light product-add" data-product-add>Add to cart</button>
      </div>
    </section>
  </main>
  <aside class="cart-drawer" aria-label="Shopping cart"><div class="drawer-head"><h2>Your cart</h2><button class="icon-button" data-close-cart>Close</button></div><p class="cart-status" role="status" aria-live="polite"></p><div data-cart-content></div></aside><div class="drawer-backdrop" data-close-cart></div>
  <script src="js/config.js" defer></script><script src="js/products.js?v=yin-yang-2" defer></script><script src="js/cart.js" defer></script><script src="js/product-page.js?v=yin-yang-2" defer></script>
</body>
</html>
